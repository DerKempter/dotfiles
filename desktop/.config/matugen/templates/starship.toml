"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$hostname$jobs$status${custom.spotify}$fill$cmd_duration$battery$memory_usage${custom.disk_usage}$os$sudo$docker_context
$git_branch$git_status$git_commit$git_state${custom.git_identity}$nodejs$dotnet$python$kubernetes
$character"""

palette = "matugen"

[fill]
symbol = " "
style = "cyan"

[directory]
style = "bold fg:base bg:teal"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
format = "[](teal)[$symbol$path]($style)[](teal) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
"Music" = "󱍚 "
"Pictures" = "󰉏 "
"dotfiles" = "󱒓 "

[character]
success_symbol = "[󰄾](bold sky)"
error_symbol = "[󰄾](bold flamingo)"

[os]
disabled = false
style = "bg:pink fg:base"
format = "[](pink)[ $symbol ]($style)[](pink) "

[os.symbols]
Linux = ""
CachyOS = ""
Arch = "󰣇"
Ubuntu = "󱄈"
Windows = "󰍲"

[hostname]
ssh_only = true
format = "[](rosewater)[󱒋 $hostname]($style)[](rosewater) "
style = "bg:rosewater fg:base"

[jobs]
symbol = " "
style = "bg:peach fg:base"
format = "[[](peach)[$symbol$number]($style)[](peach) ](peach) "

[git_branch]
symbol = " "
style = "bg:base fg:mauve"
truncation_length = 35
truncation_symbol = "…"
format = "[](base)[$symbol$branch]($style)[](base) "

[git_commit]
commit_hash_length = 4
tag_symbol = " "
style = "bg:base fg:subtext1"
format = "[](base)[$symbol$hash]($style)[](base) "

[git_state]
style = "bg:maroon fg:base"
format = "[](maroon)[$state($progress_current/$progress_total)]($style)[](maroon) "

[git_status]
format = "([$staged$modified$deleted$renamed$untracked$stashed$conflicted$ahead_behind](fg:pink))"
style = "fg:pink"
staged     = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
modified   = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
deleted    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
renamed    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
untracked  = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
stashed    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
conflicted = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
ahead      = "[](pink)[󱖣 ${count}](bg:pink fg:base)[](pink) "
behind     = "[](pink)[󱖡 ${count}](bg:pink fg:base)[](pink) "
diverged   = "[](pink)[󱖤 󱖣${ahead_count}󱖡${behind_count}](bg:pink fg:base)[](pink) "

[nodejs]
symbol = " "
style = "bg:teal fg:base"
format = "[](teal)[$symbol($version)]($style)[](teal) "

[docker_context]
disabled = false
symbol = " "
style = "bg:blue fg:base"
only_with_files = false
format = "[](blue)[$symbol$context]($style)[](blue) "

[kubernetes]
symbol = "☸ "
style = "bg:blue fg:base"
disabled = false
format = "[](blue)[$symbol$context]($style)[](blue) "

[cmd_duration]
min_time = 500
style = "bg:peach fg:base"
format = "[](peach)[󱎫 $duration]($style)[](peach) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
format = "[$style](fg:$style)[$symbol$percentage](bg:$style fg:base)[ $style](fg:$style) "

[[battery.display]]
threshold = 20
style = "maroon"

[[battery.display]]
threshold = 50
style = "peach"

[memory_usage]
disabled = true
threshold = 75
symbol = "󰍛 "
style = "bg:pink fg:base"
format = "[](pink)[$symbol$ram_pct]($style)[](pink) "

[custom.disk_usage]
command = "usage=$(df $HOME --output=pcent | tail -1 | tr -dc '0-9'); if [ \"$usage\" -gt 85 ]; then echo $usage; fi"
shell = ["sh"]
style = "bg:flamingo fg:base"
format = "([](flamingo)[󰻚 $output%]($style)[](flamingo) )"
when = "true"

[custom.git_identity]
command = "local=$(git config --local user.email); global=$(git config --global user.email); if [ -n \"$local\" ] && [ \"$local\" != \"$global\" ]; then echo \"$local\"; fi"
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
shell = ["sh"]
style = "bg:rosewater fg:base"
format = "([](rosewater)[ $output]($style)[](rosewater) )"

[custom.spotify]
command = "artist=$(playerctl --player=spotify_player,spotify,%any metadata artist 2>/dev/null); title=$(playerctl --player=spotify_player,spotify,%any metadata title 2>/dev/null); full=\"$artist - $title\"; if [ ${#full} -gt 35 ]; then echo \"$(echo \"$full\" | cut -c 1-32)…\"; else echo \"$full\"; fi"
when = 'test "$(playerctl --player=spotify_player,spotify,%any status 2>/dev/null)" = "Playing"'
shell = ["sh"]
style = "bg:green fg:base"
format = "([](green)[󱳇 $output]($style)[](green) )"

[dotnet]
symbol = "󲺮 "
style = "bg:lavender fg:base"
format = "[](lavender)[$symbol($version)]($style)[](lavender) "

[python]
symbol = " "
style = "bg:yellow fg:base"
format = "[](yellow)[$symbol${pyenv_prefix}($version )($virtualenv)]($style)[](yellow) "

[status]
disabled = false
style = "bg:flamingo fg:base"
symbol = "✘"
format = "[](flamingo)[ $symbol ]($style)[](flamingo) "
map_symbol = true

[sudo]
disabled = false
symbol = "󱞀"
style = "bg:flamingo fg:base"
format = "[](flamingo)[ $symbol ]($style)[](flamingo) "

[palettes.matugen]
crust = "#{{colors.background.default.hex_stripped}}"
mantle = "#{{colors.surface.default.hex_stripped}}"
base = "#{{colors.surface_container.default.hex_stripped}}"

overlay2 = "#{{colors.outline.default.hex_stripped}}"
overlay1 = "#{{colors.outline_variant.default.hex_stripped}}"
overlay0 = "#{{colors.surface_container_highest.default.hex_stripped}}"

surface2 = "#{{colors.surface_container_high.default.hex_stripped}}"
surface1 = "#{{colors.surface_container.default.hex_stripped}}"
surface0 = "#{{colors.surface.default.hex_stripped}}"

text = "#{{colors.on_surface.default.hex_stripped}}"
subtext1 = "#{{colors.on_surface_variant.default.hex_stripped}}"
subtext0 = "#{{colors.outline.default.hex_stripped}}"

rosewater = "#{{colors.primary_container.default.hex_stripped}}"
flamingo = "#{{colors.error.default.hex_stripped}}"
pink = "#{{colors.primary.default.hex_stripped}}"
mauve = "#{{colors.secondary.default.hex_stripped}}"
red = "#{{colors.error.default.hex_stripped}}"
maroon = "#{{colors.error.default.hex_stripped}}"
peach = "#{{colors.tertiary.default.hex_stripped}}"
yellow = "#{{colors.tertiary_container.default.hex_stripped}}"
green = "#{{colors.primary.default.hex_stripped}}"
teal = "#{{colors.secondary.default.hex_stripped}}"
sky = "#{{colors.primary.default.hex_stripped}}"
sapphire = "#{{colors.secondary.default.hex_stripped}}"
blue = "#{{colors.secondary_container.default.hex_stripped}}"
lavender = "#{{colors.tertiary.default.hex_stripped}}"
cyan = "#{{colors.outline_variant.default.hex_stripped}}"
