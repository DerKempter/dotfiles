source = ~/.config/hypr/scheme/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    rounding = 16
    
    # Dynamic Theme Colors
    inner_color = $surface_container
    outer_color = $primary
    font_color = $on_surface
    check_color = $secondary
    fail_color = $error
    placeholder_text = <span font_family="JetBrains Mono"><i>Password...</i></span>
    
    position = 0, -80
    halign = center
    valign = center
}

# Current Time (Dynamic Primary Accent)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# Current Date (Dynamic Secondary Accent)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $secondary
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
