[meta]
name = "Matugen"
description = "Material You dynamic theme generated by Matugen"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#{{colors.primary.default.hex_stripped}}"
accent_foreground = "#{{colors.on_primary.default.hex_stripped}}"
background = "#{{colors.background.default.hex_stripped}}"
foreground = "#{{colors.on_surface.default.hex_stripped}}"
secondary_background = "#{{colors.surface_container.default.hex_stripped}}"
border = "#{{colors.outline_variant.default.hex_stripped}}"

[colors.main_window]
border = "#{{colors.outline_variant.default.hex_stripped}}"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "#{{colors.outline_variant.default.hex_stripped}}"

[colors.accents]
blue = "#{{colors.primary.default.hex_stripped}}"
green = "#{{colors.tertiary.default.hex_stripped}}"
magenta = "#{{colors.secondary.default.hex_stripped}}"
orange = "#{{colors.tertiary.default.hex_stripped}}"
red = "#{{colors.error.default.hex_stripped}}"
yellow = "#{{colors.secondary.default.hex_stripped}}"
cyan = "#{{colors.primary.default.hex_stripped}}"
purple = "#{{colors.secondary.default.hex_stripped}}"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#{{colors.on_surface_variant.default.hex_stripped}}"
danger = "#{{colors.error.default.hex_stripped}}"
success = "#{{colors.primary.default.hex_stripped}}"
placeholder = "#{{colors.outline.default.hex_stripped}}"
selection = { background = "#{{colors.primary_container.default.hex_stripped}}", foreground = "#{{colors.on_primary_container.default.hex_stripped}}" }

[colors.text.links]
default = "#{{colors.primary.default.hex_stripped}}"
visited = "#{{colors.secondary.default.hex_stripped}}"

[colors.input]
border = "#{{colors.outline_variant.default.hex_stripped}}"
border_focus = "#{{colors.primary.default.hex_stripped}}"
border_error = "#{{colors.error.default.hex_stripped}}"

[colors.button.primary]
background = "#{{colors.surface_container_high.default.hex_stripped}}"
foreground = "#{{colors.on_surface.default.hex_stripped}}"
hover = { background = "#{{colors.surface_container_highest.default.hex_stripped}}" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "#{{colors.on_surface.default.hex_stripped}}"
secondary_foreground = "#{{colors.on_surface_variant.default.hex_stripped}}"

[colors.list.item.selection]
background = "#{{colors.primary_container.default.hex_stripped}}"
foreground = "#{{colors.on_primary_container.default.hex_stripped}}"
secondary_background = "#{{colors.primary_container.default.hex_stripped}}"
secondary_foreground = "#{{colors.on_primary_container.default.hex_stripped}}"

[colors.grid.item]
background = "#{{colors.surface_container.default.hex_stripped}}"
hover = { outline = "#{{colors.outline.default.hex_stripped}}" }
selection = { outline = "#{{colors.primary.default.hex_stripped}}" }

[colors.scrollbars]
background = "#{{colors.outline_variant.default.hex_stripped}}"

[colors.loading]
bar = "#{{colors.primary.default.hex_stripped}}"
spinner = "#{{colors.primary.default.hex_stripped}}"
