# Yazi Material You dynamic flavor generated by Matugen

# --- Manager ---
[mgr]
cwd = { fg = "#{{colors.primary.default.hex_stripped}}" }

# Find
find_keyword  = { fg = "#{{colors.tertiary.default.hex_stripped}}", bold = true, italic = true, underline = true }
find_position = { fg = "#{{colors.secondary.default.hex_stripped}}", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#{{colors.primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}" }
marker_cut      = { fg = "#{{colors.error.default.hex_stripped}}", bg = "#{{colors.error.default.hex_stripped}}" }
marker_marked   = { fg = "#{{colors.tertiary.default.hex_stripped}}", bg = "#{{colors.tertiary.default.hex_stripped}}" }
marker_selected = { fg = "#{{colors.secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}" }

# Count
count_copied   = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}" }
count_cut      = { fg = "#{{colors.on_error.default.hex_stripped}}", bg = "#{{colors.error.default.hex_stripped}}" }
count_selected = { fg = "#{{colors.on_secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}" }

# Border
border_symbol = "│"
border_style  = { fg = "#{{colors.outline_variant.default.hex_stripped}}" }


# --- Tabs ---
[tabs]
active   = { fg = "#{{colors.on_primary_container.default.hex_stripped}}", bg = "#{{colors.primary_container.default.hex_stripped}}", bold = true }
inactive = { fg = "#{{colors.on_surface_variant.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }


# --- Mode ---
[mode]
normal_main = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}", bold = true }
normal_alt  = { fg = "#{{colors.primary.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }

# Select mode
select_main = { fg = "#{{colors.on_secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}", bold = true }
select_alt  = { fg = "#{{colors.secondary.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }

# Unset mode
unset_main = { fg = "#{{colors.on_tertiary.default.hex_stripped}}", bg = "#{{colors.tertiary.default.hex_stripped}}", bold = true }
unset_alt  = { fg = "#{{colors.tertiary.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }


# --- Status bar ---
[status]
# Permissions
perm_sep   = { fg = "#{{colors.outline.default.hex_stripped}}" }
perm_type  = { fg = "#{{colors.primary.default.hex_stripped}}" }
perm_read  = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
perm_write = { fg = "#{{colors.error.default.hex_stripped}}" }
perm_exec  = { fg = "#{{colors.secondary.default.hex_stripped}}" }

# Progress
progress_label  = { fg = "#{{colors.on_primary.default.hex_stripped}}", bold = true }
progress_normal = { fg = "#{{colors.on_primary_container.default.hex_stripped}}", bg = "#{{colors.primary_container.default.hex_stripped}}" }
progress_error  = { fg = "#{{colors.on_error.default.hex_stripped}}", bg = "#{{colors.error.default.hex_stripped}}" }


# --- Pick ---
[pick]
border   = { fg = "#{{colors.primary.default.hex_stripped}}" }
active   = { fg = "#{{colors.secondary.default.hex_stripped}}", bold = true }
inactive = {}


# --- Input ---
[input]
border   = { fg = "#{{colors.primary.default.hex_stripped}}" }
title    = {}
value    = {}
selected = { reversed = true }


# --- Completion ---
[cmp]
border = { fg = "#{{colors.primary.default.hex_stripped}}" }


# --- Tasks ---
[tasks]
border  = { fg = "#{{colors.primary.default.hex_stripped}}" }
title   = {}
hovered = { fg = "#{{colors.secondary.default.hex_stripped}}", bold = true }


# --- Which ---
[which]
mask            = { bg = "#{{colors.surface_container.default.hex_stripped}}" }
cand            = { fg = "#{{colors.primary.default.hex_stripped}}" }
rest            = { fg = "#{{colors.on_surface_variant.default.hex_stripped}}" }
desc            = { fg = "#{{colors.secondary.default.hex_stripped}}" }
separator       = "  "
separator_style = { fg = "#{{colors.outline_variant.default.hex_stripped}}" }


# --- Help ---
[help]
on      = { fg = "#{{colors.primary.default.hex_stripped}}" }
run     = { fg = "#{{colors.secondary.default.hex_stripped}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#{{colors.on_surface_variant.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }


# --- Spotter ---
[spot]
border   = { fg = "#{{colors.primary.default.hex_stripped}}" }
title    = { fg = "#{{colors.primary.default.hex_stripped}}" }
tbl_col  = { fg = "#{{colors.secondary.default.hex_stripped}}" }
tbl_cell = { fg = "#{{colors.on_surface.default.hex_stripped}}", bg = "#{{colors.surface_container.default.hex_stripped}}" }


# --- Notification ---
[notify]
title_info  = { fg = "#{{colors.primary.default.hex_stripped}}" }
title_warn  = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
title_error = { fg = "#{{colors.error.default.hex_stripped}}" }


# --- File-specific styles ---
[filetype]
rules = [
	# Image
	{ mime = "image/*", fg = "#{{colors.primary.default.hex_stripped}}" },
	# Media
	{ mime = "{audio,video}/*", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#{{colors.secondary.default.hex_stripped}}" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#{{colors.primary.default.hex_stripped}}" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#{{colors.outline.default.hex_stripped}}" },
	# Fallback
	{ url = "*", fg = "#{{colors.on_surface.default.hex_stripped}}" },
	{ url = "*/", fg = "#{{colors.primary.default.hex_stripped}}" },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#{{colors.secondary.default.hex_stripped}}" },
	{ name = ".git", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = ".github", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = ".npm", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Desktop", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Development", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Documents", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Downloads", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Library", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Movies", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Music", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Pictures", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Public", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ name = "Videos", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#{{colors.on_surface.default.hex_stripped}}" },
	{ if = "link", text = "", fg = "#{{colors.outline.default.hex_stripped}}" },
	{ if = "block", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "char", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "fifo", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "sock", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "sticky", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "dummy", text = "", fg = "#{{colors.error.default.hex_stripped}}" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ if = "dir", text = "", fg = "#{{colors.primary.default.hex_stripped}}" },
	{ if = "exec", text = "", fg = "#{{colors.tertiary.default.hex_stripped}}" },
	{ if = "!dir", text = "", fg = "#{{colors.on_surface.default.hex_stripped}}" },
]
