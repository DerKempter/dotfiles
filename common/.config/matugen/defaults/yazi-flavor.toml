# Yazi Material You dynamic flavor generated by Matugen

# --- Manager ---
[mgr]
cwd = { fg = "#74d7cb" }

# Find
find_keyword  = { fg = "#e7b7e8", bold = true, italic = true, underline = true }
find_position = { fg = "#ecb8ce", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#74d7cb", bg = "#74d7cb" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#e7b7e8", bg = "#e7b7e8" }
marker_selected = { fg = "#ecb8ce", bg = "#ecb8ce" }

# Count
count_copied   = { fg = "#003732", bg = "#74d7cb" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#482536", bg = "#ecb8ce" }

# Border
border_symbol = "│"
border_style  = { fg = "#4f4350" }


# --- Tabs ---
[tabs]
active   = { fg = "#91f4e7", bg = "#005049", bold = true }
inactive = { fg = "#d2c1d2", bg = "#241d25" }


# --- Mode ---
[mode]
normal_main = { fg = "#003732", bg = "#74d7cb", bold = true }
normal_alt  = { fg = "#74d7cb", bg = "#241d25" }

# Select mode
select_main = { fg = "#482536", bg = "#ecb8ce", bold = true }
select_alt  = { fg = "#ecb8ce", bg = "#241d25" }

# Unset mode
unset_main = { fg = "#46234a", bg = "#e7b7e8", bold = true }
unset_alt  = { fg = "#e7b7e8", bg = "#241d25" }


# --- Status bar ---
[status]
# Permissions
perm_sep   = { fg = "#9b8c9b" }
perm_type  = { fg = "#74d7cb" }
perm_read  = { fg = "#e7b7e8" }
perm_write = { fg = "#ffb4ab" }
perm_exec  = { fg = "#ecb8ce" }

# Progress
progress_label  = { fg = "#003732", bold = true }
progress_normal = { fg = "#91f4e7", bg = "#005049" }
progress_error  = { fg = "#690005", bg = "#ffb4ab" }


# --- Pick ---
[pick]
border   = { fg = "#74d7cb" }
active   = { fg = "#ecb8ce", bold = true }
inactive = {}


# --- Input ---
[input]
border   = { fg = "#74d7cb" }
title    = {}
value    = {}
selected = { reversed = true }


# --- Completion ---
[cmp]
border = { fg = "#74d7cb" }


# --- Tasks ---
[tasks]
border  = { fg = "#74d7cb" }
title   = {}
hovered = { fg = "#ecb8ce", bold = true }


# --- Which ---
[which]
mask            = { bg = "#241d25" }
cand            = { fg = "#74d7cb" }
rest            = { fg = "#d2c1d2" }
desc            = { fg = "#ecb8ce" }
separator       = "  "
separator_style = { fg = "#4f4350" }


# --- Help ---
[help]
on      = { fg = "#74d7cb" }
run     = { fg = "#ecb8ce" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#d2c1d2", bg = "#241d25" }


# --- Spotter ---
[spot]
border   = { fg = "#74d7cb" }
title    = { fg = "#74d7cb" }
tbl_col  = { fg = "#ecb8ce" }
tbl_cell = { fg = "#ebdfe9", bg = "#241d25" }


# --- Notification ---
[notify]
title_info  = { fg = "#74d7cb" }
title_warn  = { fg = "#e7b7e8" }
title_error = { fg = "#ffb4ab" }


# --- File-specific styles ---
[filetype]
rules = [
	# Image
	{ mime = "image/*", fg = "#74d7cb" },
	# Media
	{ mime = "{audio,video}/*", fg = "#e7b7e8" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ecb8ce" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#74d7cb" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#9b8c9b" },
	# Fallback
	{ url = "*", fg = "#ebdfe9" },
	{ url = "*/", fg = "#74d7cb" },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#ecb8ce" },
	{ name = ".git", text = "", fg = "#74d7cb" },
	{ name = ".github", text = "", fg = "#74d7cb" },
	{ name = ".npm", text = "", fg = "#74d7cb" },
	{ name = "Desktop", text = "", fg = "#74d7cb" },
	{ name = "Development", text = "", fg = "#74d7cb" },
	{ name = "Documents", text = "", fg = "#74d7cb" },
	{ name = "Downloads", text = "", fg = "#74d7cb" },
	{ name = "Library", text = "", fg = "#74d7cb" },
	{ name = "Movies", text = "", fg = "#74d7cb" },
	{ name = "Music", text = "", fg = "#74d7cb" },
	{ name = "Pictures", text = "", fg = "#74d7cb" },
	{ name = "Public", text = "", fg = "#74d7cb" },
	{ name = "Videos", text = "", fg = "#74d7cb" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#ebdfe9" },
	{ if = "link", text = "", fg = "#9b8c9b" },
	{ if = "block", text = "", fg = "#e7b7e8" },
	{ if = "char", text = "", fg = "#e7b7e8" },
	{ if = "fifo", text = "", fg = "#e7b7e8" },
	{ if = "sock", text = "", fg = "#e7b7e8" },
	{ if = "sticky", text = "", fg = "#e7b7e8" },
	{ if = "dummy", text = "", fg = "#ffb4ab" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#74d7cb" },
	{ if = "dir", text = "", fg = "#74d7cb" },
	{ if = "exec", text = "", fg = "#e7b7e8" },
	{ if = "!dir", text = "", fg = "#ebdfe9" },
]
