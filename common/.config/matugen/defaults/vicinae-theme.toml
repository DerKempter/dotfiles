[meta]
name = "Matugen"
description = "Material You dynamic theme generated by Matugen"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#74d7cb"
accent_foreground = "#003732"
background = "#171118"
foreground = "#ebdfe9"
secondary_background = "#241d25"
border = "#4f4350"

[colors.main_window]
border = "#4f4350"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "#4f4350"

[colors.accents]
blue = "#74d7cb"
green = "#e7b7e8"
magenta = "#ecb8ce"
orange = "#e7b7e8"
red = "#ffb4ab"
yellow = "#ecb8ce"
cyan = "#74d7cb"
purple = "#ecb8ce"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#d2c1d2"
danger = "#ffb4ab"
success = "#74d7cb"
placeholder = "#9b8c9b"
selection = { background = "#005049", foreground = "#91f4e7" }

[colors.text.links]
default = "#74d7cb"
visited = "#ecb8ce"

[colors.input]
border = "#4f4350"
border_focus = "#74d7cb"
border_error = "#ffb4ab"

[colors.button.primary]
background = "#2f282f"
foreground = "#ebdfe9"
hover = { background = "#3a323a" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "#ebdfe9"
secondary_foreground = "#d2c1d2"

[colors.list.item.selection]
background = "#005049"
foreground = "#91f4e7"
secondary_background = "#005049"
secondary_foreground = "#91f4e7"

[colors.grid.item]
background = "#241d25"
hover = { outline = "#9b8c9b" }
selection = { outline = "#74d7cb" }

[colors.scrollbars]
background = "#4f4350"

[colors.loading]
bar = "#74d7cb"
spinner = "#74d7cb"
