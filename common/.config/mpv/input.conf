# ==============================================================================
# MPV Input Configuration (Borderless & uosc Optimized)
# ==============================================================================

# Playback Controls
space        cycle pause; script-binding uosc/flash-pause-indicator
p            cycle pause; script-binding uosc/flash-pause-indicator

# Seeking (with visual feedback via uosc)
RIGHT        seek  5; script-binding uosc/flash-timeline
LEFT         seek -5; script-binding uosc/flash-timeline
Shift+RIGHT  seek  30; script-binding uosc/flash-timeline
Shift+LEFT   seek -30; script-binding uosc/flash-timeline

# Volume Manipulation (with visual feedback via uosc)
UP           add volume  2; script-binding uosc/flash-volume
DOWN         add volume -2; script-binding uosc/flash-volume
WHEEL_UP     add volume  2; script-binding uosc/flash-volume
WHEEL_DOWN   add volume -2; script-binding uosc/flash-volume
m            cycle mute; script-binding uosc/flash-volume

# uosc UI Overlay Components
tab          script-binding uosc/toggle-ui
mbtn_right   script-binding uosc/menu
menu         script-binding uosc/menu

# Track & Feature Menus (uosc native visual controls)
a            script-binding uosc/audio          # Select audio track
s            script-binding uosc/subtitles      # Select subtitle track
v            script-binding uosc/video          # Select video track
c            script-binding uosc/chapters       # Select chapters
shift+p      script-binding uosc/playlist       # Select playlist / show playlist
o            script-binding uosc/open-file      # Open file dialog
q            script-binding uosc/stream-quality # Stream quality menu
