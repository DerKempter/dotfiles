# Video Output & GPU Context
vo=gpu-next
gpu-context=wayland
profile=high-quality

# Hardware Decoding (AMD Ryzen AI Radeon 880M VA-API)
hwdec=vaapi
hwdec-codecs=all

# Smooth 50Hz PAL Playback on High Refresh / 60Hz Displays
video-sync=audio
interpolation=no
tscale=oversample

# Audio Output (Native PipeWire)
ao=pipewire

# UI Options (Optimized for uosc borderless experience)
border=no
osc=no
osd-bar=no

# Behavior
keep-open=yes
save-position-on-quit=yes

# ==============================================================================
# Conditional Profile: German Broadcast SD (576i / MPEG-2)
# Applies dynamically to 576i/p streams and reverts automatically for 720p/1080p
# ==============================================================================
[sd-pal]
profile-desc="Clean up German 576i SD TV"
profile-cond=get("height", 0) <= 576 and get("height", 0) > 0
profile-restore=copy

hwdec=no
vf=bwdif=mode=1:parity=-1:deint=1

deband=yes
deband-iterations=1
deband-threshold=35
deband-range=16
deband-grain=8

# Use fast separable 1D scalers instead of heavy 2D polar EWA
scale=spline36
cscale=spline36
dscale=mitchell

# Shaders: r2 cuts RAVU GPU time in half; CAS provides the sharpness
glsl-shader="~/.config/mpv/shaders/ravu-zoom-ar-r2.hook"
glsl-shader="~/.config/mpv/shaders/CAS.glsl"
