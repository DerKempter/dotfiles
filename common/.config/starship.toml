"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$hostname$jobs$status${custom.spotify}$fill$cmd_duration$battery$memory_usage${custom.disk_usage}$os$sudo$docker_context
$git_branch$git_status$git_commit$git_state${custom.git_identity}$nodejs$dotnet$python$kubernetes
$character"""

palette = "catppuccin_mocha"

[fill]
symbol = " "
style = "cyan"

[directory]
style = "bold fg:base bg:teal"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
format = "[](teal)[$symbol$path]($style)[](teal) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󱑢 "
"Music" = "󰝚 "
"Pictures" = "󰉏 "
"dotfiles" = "󰒓 "

[character]
success_symbol = "[󰄾](bold sky)"
error_symbol = "[󰄾](bold flamingo)"

[os]
disabled = false
style = "bg:pink fg:base"
format = "[](pink)[ $symbol ]($style)[](pink) "

[os.symbols]
Linux = ""
CachyOS = ""
Arch = "󰣇"
Ubuntu = "󰕈"
Windows = "󰍲"

[hostname]
ssh_only = true
format = "[](rosewater)[󰒋 $hostname]($style)[](rosewater) "
style = "bg:rosewater fg:base"

[jobs]
symbol = " "
style = "bg:peach fg:base"
format = "[[](peach)[$symbol$number]($style)[](peach) ](peach) "

[git_branch]
symbol = " "
style = "bg:base fg:mauve"
truncation_length = 35
truncation_symbol = "…"
format = "[](base)[$symbol$branch]($style)[](base) "

[git_commit]
commit_hash_length = 4
tag_symbol = " "
style = "bg:base fg:subtext1"
format = "[](base)[$symbol$hash]($style)[](base) "

[git_state]
style = "bg:maroon fg:base"
format = "[](maroon)[$state($progress_current/$progress_total)]($style)[](maroon) "

[git_status]
format = "([$staged$modified$deleted$renamed$untracked$stashed$conflicted$ahead_behind](fg:pink))"
style = "fg:pink"
staged     = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
modified   = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
deleted    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
renamed    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
untracked  = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
stashed    = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
conflicted = "[](pink)[ ${count}](bg:pink fg:base)[](pink) "
ahead      = "[](pink)[󰶣 ${count}](bg:pink fg:base)[](pink) "
behind     = "[](pink)[󰶡 ${count}](bg:pink fg:base)[](pink) "
diverged   = "[](pink)[󰶤 󰶣${ahead_count}󰶡${behind_count}](bg:pink fg:base)[](pink) "

[nodejs]
symbol = " "
style = "bg:teal fg:base"
format = "[](teal)[$symbol($version)]($style)[](teal) "

[docker_context]
disabled = false
symbol = " "
style = "bg:blue fg:base"
only_with_files = false
format = "[](blue)[$symbol$context]($style)[](blue) "

[kubernetes]
symbol = "☸ "
style = "bg:blue fg:base"
disabled = false
format = "[](blue)[$symbol$context]($style)[](blue) "

[cmd_duration]
min_time = 500
style = "bg:peach fg:base"
format = "[](peach)[󱎫 $duration]($style)[](peach) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
format = "[$style](fg:$style)[$symbol$percentage](bg:$style fg:base)[ $style](fg:$style) "

[[battery.display]]
threshold = 20
style = "maroon"

[[battery.display]]
threshold = 50
style = "peach"

[memory_usage]
disabled = true
threshold = 75
symbol = "󰍛 "
style = "bg:pink fg:base"
format = "[](pink)[$symbol$ram_pct]($style)[](pink) "

[custom.disk_usage]
command = "usage=$(df $HOME --output=pcent | tail -1 | tr -dc '0-9'); if [ \"$usage\" -gt 85 ]; then echo $usage; fi"
shell = ["sh"]
style = "bg:flamingo fg:base"
format = "([](flamingo)[󰋊 $output%]($style)[](flamingo) )"
when = "true"

[custom.git_identity]
command = "local=$(git config --local user.email); global=$(git config --global user.email); if [ -n \"$local\" ] && [ \"$local\" != \"$global\" ]; then echo \"$local\"; fi"
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
shell = ["sh"]
style = "bg:rosewater fg:base"
format = "([](rosewater)[ $output]($style)[](rosewater) )"

[custom.spotify]
command = "title=$(playerctl --player=spotify_player,spotify,%any metadata --format '{{ artist }} - {{ title }}' 2>/dev/null); if [ ${#title} -gt 35 ]; then echo \"$(echo \"$title\" | cut -c 1-32)…\"; else echo \"$title\"; fi"
when = 'test "$(playerctl --player=spotify_player,spotify,%any status 2>/dev/null)" = "Playing"'
shell = ["sh"]
style = "bg:green fg:base"
format = "([](green)[󰓇 $output]($style)[](green) )"

[dotnet]
symbol = "󰪮 "
style = "bg:lavender fg:base"
format = "[](lavender)[$symbol($version)]($style)[](lavender) "

[python]
symbol = " "
style = "bg:yellow fg:base"
format = "[](yellow)[$symbol${pyenv_prefix}($version )($virtualenv)]($style)[](yellow) "

[status]
disabled = false
style = "bg:flamingo fg:base"
symbol = "✘"
format = "[](flamingo)[ $symbol ]($style)[](flamingo) "
map_symbol = true

[sudo]
disabled = false
symbol = "󰞀"
style = "bg:flamingo fg:base"
format = "[](flamingo)[ $symbol ]($style)[](flamingo) "

[palettes.catppuccin_mocha]
# --- background ---
crust = "#11111b"
mantle = "#181825"
base = "#1e1e2e"

overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"

surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"

# --- text ---
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"

# --- accents ---
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"

dirtypink = "#240f33"
