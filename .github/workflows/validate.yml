name: Validate Dotfiles

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Shells & Workflow Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish stow just
          # Install atuin and zoxide for realistic CI validation
          curl -sS https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash
          curl --proto '=https' --tlsv1.2 -sSf https://setup.atuin.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.atuin/bin" >> $GITHUB_PATH

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.114.1' # Matches your local shell version

      - name: Link Configurations
        run: |
          # Remove default runner shell files and pre-generated configs to avoid stow collisions
          rm -f ~/.bashrc ~/.bash_logout ~/.profile ~/.zshrc
          rm -rf ~/.config/fish
          stow -R common --dir "$PWD" --target "$HOME" --verbose
          stow -R desktop --dir "$PWD" --target "$HOME" --verbose

      - name: Execute Validations
        run: |
          just check
