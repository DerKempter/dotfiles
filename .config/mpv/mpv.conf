# ==============================================================================
# MPV Core Configuration (High-Performance Wayland & AMD VA-API)
# ==============================================================================

# Video Output & GPU Context
vo=gpu-next
gpu-context=wayland

# Hardware Decoding (AMD Ryzen AI Radeon 880M VA-API)
hwdec=vaapi
hwdec-codecs=all

# High Quality rendering profile
profile=gpu-hq

# Audio Output (Native PipeWire)
ao=pipewire

# UI Options (Optimized for uosc borderless experience)
border=no
osc=no
osd-bar=no

# Behavior
keep-open=yes
save-position-on-quit=yes
